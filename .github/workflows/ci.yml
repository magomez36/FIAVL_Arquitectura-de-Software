name: Base FIAVL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: .\fiavl.cmd check
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preparar npm en el directorio del runner
        run: |
          version=$(node -p "require('./package.json').engines.npm")
          npm install --prefix "$RUNNER_TEMP/fiavl" --ignore-scripts --no-audit --no-fund "npm@$version"
          echo "$RUNNER_TEMP/fiavl/node_modules/.bin" >> "$GITHUB_PATH"
      - run: node scripts/verify-runtime.mjs
      - run: npm ci
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
